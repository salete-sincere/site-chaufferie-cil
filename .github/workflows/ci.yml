name: Golden Journeys and immutable image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep published cards on the public origin; repository variables cannot revert them to staging.
  SITE_URL: https://stopchaufferiehaubourdin.fr

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep Chromium sandboxing enabled without Ubuntu 24.04's runner namespace restriction.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      APP_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Install Chromium for Golden Journeys
        run: npx --no-install playwright install --with-deps chromium
      - name: Golden Journeys against production build
        run: npm run test:e2e
      - name: Attach revision and commands
        if: always()
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          printf '### Golden Journeys\n\nSHA: `%s`\n\nNode.js 24, Ubuntu 22.04, Chromium with sandbox enabled.\n\nCommands: `npm run build`, `npm run typecheck`, `npm test`, `npm run test:e2e`.\n\nSee the test report for actual results and simulated browser capabilities.\n' "$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-journeys-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tested revision
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
