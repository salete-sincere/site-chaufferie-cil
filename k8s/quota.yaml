apiVersion: v1
kind: ResourceQuota
metadata:
  name: site-chaufferie-cil
  namespace: site-chaufferie-cil
spec:
  hard:
    pods: "4"
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 2Gi
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: site-chaufferie-cil
  namespace: site-chaufferie-cil
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
